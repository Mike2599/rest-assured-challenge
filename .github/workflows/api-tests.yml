name: API tests

# Restful-Booker es pública y no necesita secretos, así que la suite corre en cada push y pull request.
# En main además publica el reporte de Allure en GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      env:
        description: Ambiente de application.conf
        type: choice
        options: [qa, staging]
        default: qa

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar las pruebas
        run: ./mvnw -B clean test -Denv=${{ inputs.env || 'qa' }}

      - name: Generar el reporte de Allure
        if: ${{ !cancelled() }}
        run: ./mvnw -B allure:report

      - name: Guardar el reporte como artefacto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14

      - name: Preparar el reporte para GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  publish-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
