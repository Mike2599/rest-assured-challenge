# ──────────────────────────────────────────────────────────────────────────────
#  Configuración por ambiente. Se elige con -Denv=<nombre> (por defecto: qa).
#    mvn clean test -Denv=qa
#    mvn clean test -Denv=staging
#
#  Cualquier valor se puede sobrescribir con variables de entorno (útil en CI),
#  por ejemplo BOOKER_PASSWORD, sin modificar este archivo.
#  Los tokens NUNCA se guardan aquí: se generan en tiempo de ejecución con POST /auth.
# ──────────────────────────────────────────────────────────────────────────────

defaults {
  base-url = "https://restful-booker.herokuapp.com"
  base-url = ${?BOOKER_BASE_URL}

  # Credenciales de demostración que publica la documentación de Restful-Booker.
  credentials {
    username = "admin"
    username = ${?BOOKER_USERNAME}
    password = "password123"
    password = ${?BOOKER_PASSWORD}
  }

  # Acuerdo de nivel de servicio para las consultas (escenario 4).
  sla.response-time-ms = 2000
  sla.response-time-ms = ${?BOOKER_SLA_MS}

  # Tiempos de espera del cliente HTTP.
  http {
    connect-timeout-ms = 15000
    read-timeout-ms = 30000
  }

  # ID que no existe en la API (escenario 5).
  test-data.nonexistent-booking-id = 9999999
}

environments {
  # Ambiente de QA: la instancia pública de Restful-Booker.
  qa = ${defaults}

  # Restful-Booker solo publica una instancia; staging apunta a la misma URL y demuestra
  # cómo un ambiente redefine solo lo que cambia (aquí, tiempos de espera más holgados).
  staging = ${defaults} {
    http.read-timeout-ms = 45000
  }
}
